[package]
name = "hsmp-server"
description = "HSMP dedicated server, game-side sidecar, master server, load tester and query tool"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[build-dependencies]
sha2 = "0.10"

[[bin]]
name = "hsmp-server"
path = "src/main.rs"

[[bin]]
name = "hsmp-sidecar"
path = "src/sidecar/main.rs"

[[bin]]
name = "hsmp-master"
path = "src/master.rs"

[[bin]]
name = "hsmp-loadtest"
path = "src/loadtest.rs"

[[bin]]
name = "hsmp-query"
path = "src/query_tool.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "rt", "net", "fs", "time", "sync", "signal", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
axum = { version = "0.7", features = ["ws"] }
tower-http = { version = "0.5", features = ["cors", "timeout"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }
dashmap = "5"
sha2 = "0.10"
uuid = { version = "1", features = ["v4", "serde"] }
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
httpdate = "1"
rand = "0.8"
chacha20poly1305 = "0.10"
socket2 = "0.5"
hsmp-net = { path = "../crates/hsmp-net" }
hsmp-ipc = { path = "../crates/hsmp-ipc", features = ["json"] }
hsmp-pose = { path = "../crates/hsmp-pose" }
hsmp-master-core = { path = "../crates/hsmp-master-core" }
hsmp-diag = { path = "../crates/hsmp-diag" }
hsmp-nat = { path = "../crates/hsmp-nat" }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
ed25519-dalek = "2"
bytemuck = "1"

[dev-dependencies]
proptest = "1"
hsmp-net = { path = "../crates/hsmp-net", features = ["testlink"] }

[lints]
workspace = true
