[package]
name = "hsmp-modes"
description = "HSMP game-mode framework (GameMode trait, Duel, FFA-LMS, LTS, zone, teams)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

# The sources live in server/src/modes/ so the server can
# either depend on this crate or `#[path]`-mount the directory as `mod modes;`. The files
# only use `super::` paths, so both work unchanged. Not wired into hsmp-server yet: see
# docs/development/subsystems/modes.md.
[lib]
name = "hsmp_modes"
path = "../../server/src/modes/mod.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
proptest = "1"

[lints]
workspace = true
