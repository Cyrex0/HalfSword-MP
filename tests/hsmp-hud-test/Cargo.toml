[package]
name = "hsmp-hud-test"
description = "Offline tests (mlua, Lua 5.4) for mods/HSMPHud"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

# Test-only crate: no runtime code. Run with  cargo test -p hsmp-hud-test
# The Lua under test is loaded from mods/HSMPHud/Scripts (the files that ship),
# against the mocked UE4SS / UMG in tests/mock_ue.lua.

[lib]
path = "src/lib.rs"

[dev-dependencies]
mlua = { version = "0.10", features = ["lua54", "vendored"] }

[lints]
workspace = true
