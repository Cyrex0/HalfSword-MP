# cargo-about configuration for THIRD-PARTY-NOTICES.html (the release zip carries it).
# Regenerate after any dependency change:
#   cargo about generate --workspace --locked --fail -o THIRD-PARTY-NOTICES.html about.hbs
# The workspace scan is a superset of the shipped binaries (hsmp-server package, hsmp-launcher,
# hsmp-native): developer tools are listed too, which is harmless. Dev-dependencies are not.

accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "BSL-1.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CDLA-Permissive-2.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "MPL-2.0",
    "CC0-1.0",
    "Unlicense",
    "0BSD",
    "bzip2-1.0.6",
    "NCSA",
    "LicenseRef-UFL-1.0",
]
targets = ["x86_64-pc-windows-msvc"]
ignore-dev-dependencies = true
ignore-build-dependencies = false
ignore-transitive-dependencies = false
workarounds = ["ring", "rustls"]
