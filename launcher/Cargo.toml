[package]
name = "hsmp-launcher"
description = "HSMP launcher: finds Half Sword, verifies the build, installs/updates/uninstalls the signed HSMP release (and fetches updates from GitHub), backs up career saves"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

# The library half (`hsmp_launcher::*`) is the single source of truth for the release
# manifest, signatures, hashing and ini handling; tools/release (`hsmp-release`) depends
# on it with `default-features = false` (no GUI).
#
#   cargo build --release --locked -p hsmp-launcher
#   cargo test -p hsmp-launcher

[lib]
path = "src/lib.rs"

[[bin]]
name = "hsmp-launcher"
path = "src/main.rs"

[features]
default = ["gui"]
gui = ["dep:eframe", "dep:rfd"]

[dependencies]
anyhow = "1"
ed25519-dalek = "2"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
# update check and download: rustls (no OpenSSL), no gzip
ureq = { version = "2.12", default-features = false, features = ["tls"] }
eframe = { version = "0.31", optional = true }
rfd = { version = "0.15", optional = true }

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
] }

[lints]
workspace = true
